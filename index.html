<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SkyTrack Bangladesh</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{box-sizing:border-box}body{margin:0;background:#071223;color:#eaf2ff;font:14px system-ui,sans-serif}header{padding:12px 15px;background:#0b1b31;border-bottom:1px solid #21344e;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:800}.brand span{color:#4de1c1}.sub{font-size:10px;color:#8fa9c7;margin-top:3px}#map{height:calc(100dvh - 160px);min-height:300px}.bottom{padding:10px;display:flex;gap:7px;align-items:center;justify-content:space-between;background:#0b1b31}.stats{font-size:11px;color:#a9bdd5;max-width:48vw}button{background:#142a44;color:#eff6ff;border:1px solid #294360;border-radius:10px;padding:10px 11px;font-weight:650}.note{font-size:10px;color:#8098b6;padding:7px 12px}.plane{font-size:20px;filter:drop-shadow(0 1px 3px #000)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1b31;color:#eaf2ff}</style></head>
<body><header><div><div class="brand">✈ Sky<span>Track</span> BD</div><div class="sub">DHAKA AIRPORT · LIVE FLIGHT MAP · NO ADS</div></div><div id="status" class="sub">Connecting…</div></header><div id="map"></div>
<div class="bottom"><div><b>বিমান / Aircraft</b><div class="stats" id="count">ফ্লাইট ডেটা লোড হচ্ছে…</div></div><button onclick="loadFlights()">↻ Refresh</button><button onclick="map.setView([23.8433,90.3978],7)">ঢাকা ✈</button></div>
<div class="note">স্বতন্ত্র বিজ্ঞাপনমুক্ত অ্যাপ · OpenSky ডেটা সীমিত বা বিলম্বিত হতে পারে · ইন্টারনেট প্রয়োজন</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const dhaka=[23.8433,90.3978];const map=L.map('map').setView(dhaka,7);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
L.circleMarker(dhaka,{radius:7,color:'#4de1c1',fillColor:'#4de1c1',fillOpacity:.9}).addTo(map).bindPopup('<b>Hazrat Shahjalal International Airport</b><br>ঢাকা, বাংলাদেশ');
let markers=[];function icon(h){return L.divIcon({className:'',html:`<div class="plane" style="transform:rotate(${h||0}deg)">✈</div>`,iconSize:[24,24],iconAnchor:[12,12]})}
async function loadFlights(){document.getElementById('status').textContent='Updating…';try{const b=map.getBounds();const url=`https://opensky-network.org/api/states/all?lamin=${b.getSouth()}&lomin=${b.getWest()}&lamax=${b.getNorth()}&lomax=${b.getEast()}`;const r=await fetch(url);if(!r.ok)throw Error('Flight feed unavailable ('+r.status+')');const d=await r.json();markers.forEach(m=>map.removeLayer(m));markers=[];(d.states||[]).forEach(s=>{if(s[5]==null||s[6]==null)return;const cs=(s[1]||'Unknown').trim(),alt=s[7]==null?'Unknown':Math.round(s[7])+' m',spd=s[9]==null?'Unknown':Math.round(s[9]*3.6)+' km/h';const m=L.marker([s[6],s[5]],{icon:icon(s[10]||0)}).bindPopup(`<b>${cs}</b><br>ICAO: ${s[0]}<br>উচ্চতা: ${alt}<br>গতি: ${spd}`);m.addTo(map);markers.push(m)});document.getElementById('count').textContent=`${markers.length} aircraft · ${d.time?new Date(d.time*1000).toLocaleTimeString():'time unknown'}`;document.getElementById('status').textContent='Feed updated'}catch(e){document.getElementById('count').textContent='ডেটা পাওয়া যায়নি: '+e.message;document.getElementById('status').textContent='Limited / Offline'}}map.on('moveend',()=>{clearTimeout(window.t);window.t=setTimeout(loadFlights,700)});loadFlights();setInterval(loadFlights,60000);
</script></body></html>
